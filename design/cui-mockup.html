<!doctype html>

<head>

<title>Projects — CUI redesign</title>
<style>
  /* CUI design system, dark theme. Token values computed from cui_theme.c
     (OKLab) at startup and set as CSS variables. */
  :root {
    --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
    --font-mono: "Geist Mono", "Cascadia Mono", Consolas, monospace;
    --r-control: 10px; --r-panel: 14px; --r-surface: 18px;
    --h-control: 36px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.45 var(--font-body);
    font-feature-settings: "tnum" 1;
    display: flex;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  [hidden] { display: none !important; }

  /* ---- sidebar ---- */
  .sidebar {
    width: 232px; flex: none; display: flex; flex-direction: column;
    background: var(--surface); border-right: 1px solid var(--border-subtle);
    padding: 16px 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
  .brand-mark { width: 22px; height: 22px; color: var(--accent); flex: none; }
  .brand-name { font-weight: 500; font-size: 14px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-label { font-size: 11px; color: var(--text-muted); padding: 8px 8px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; height: 36px;
    padding: 0 10px; border-radius: var(--r-control);
    color: var(--text-secondary); transition: background 140ms, color 140ms;
    text-align: left; width: 100%;
  }
  .nav-item:hover { background: var(--hover); color: var(--fg); }
  .nav-item.sel { background: var(--accent-subtle); color: var(--accent-strong); font-weight: 500; }
  .nav-item svg { width: 16px; height: 16px; flex: none; }
  .nav-count { margin-left: auto; font: 11px var(--font-mono); color: var(--text-muted); }
  .sidebar .grow { flex: 1; }
  .side-foot { border-top: 1px solid var(--border-subtle); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .accent-row { display: flex; gap: 6px; padding: 0 4px; }
  .accent-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent; }
  .accent-dot.sel { border-color: var(--fg); }
  .scan-note { display: flex; align-items: center; gap: 8px; padding: 0 8px; font-size: 11.5px; color: var(--text-muted); }
  .scan-note .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }

  /* ---- main ---- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 56px; flex: none; display: flex; align-items: center; gap: 12px;
    padding: 0 24px; border-bottom: 1px solid var(--border-subtle);
  }
  .page-title { font-size: 15px; font-weight: 500; }
  .grow { flex: 1; }
  .search-trigger {
    display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: var(--r-control);
    color: var(--text-muted); font-size: 12.5px; min-width: 200px;
    transition: border-color 140ms, color 140ms;
  }
  .search-trigger:hover { border-color: var(--border-strong); color: var(--text-secondary); }
  .search-trigger kbd {
    margin-left: auto; font: 11px var(--font-mono); color: var(--text-muted);
    border: 1px solid var(--border-subtle); border-radius: 5px; padding: 1px 5px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; height: var(--h-control);
    padding: 0 14px; border-radius: var(--r-control); font-weight: 500;
    transition: filter 140ms, background 140ms, border-color 140ms;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--control-on); color: var(--control-glyph); }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.ghost { border: 1px solid var(--border); color: var(--fg); }
  .btn.ghost:hover { background: var(--hover); }
  .content { flex: 1; overflow-y: auto; padding: 24px; }
  .page { display: none; max-width: 1080px; }
  .page.on { display: block; }

  /* ---- cards / metrics ---- */
  .metrics { display: flex; gap: 12px; margin-bottom: 24px; }
  .metric {
    flex: 1; background: var(--surface); border: 1px solid var(--border-subtle);
    border-radius: var(--r-surface); padding: 16px 20px;
  }
  .metric .lbl { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .metric .val { font: 500 26px/1.1 var(--font-mono); font-feature-settings: "tnum" 1; }
  .metric .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
  .metric .sub b { color: var(--success); font-weight: 500; }

  .panel {
    background: var(--surface); border: 1px solid var(--border-subtle);
    border-radius: var(--r-surface); padding: 20px 24px; margin-bottom: 24px;
  }
  .panel h3 { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .panel .desc { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
  .grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; }
  .grid2 .panel { margin-bottom: 0; }

  /* ---- badge, dot, status ---- */
  .badge {
    display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px;
    border-radius: 11px; font-size: 11.5px; font-weight: 500;
    background: var(--muted); color: var(--text-secondary);
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; }
  .badge.success { background: color-mix(in oklab, var(--success) 14%, transparent); color: var(--success); }
  .badge.info    { background: color-mix(in oklab, var(--info) 14%, transparent); color: var(--info); }
  .badge.danger  { background: color-mix(in oklab, var(--danger) 14%, transparent); color: var(--danger); }

  /* ---- table ---- */
  .table-wrap { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--r-surface); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th {
    font: 500 11.5px var(--font-body); color: var(--text-muted); text-align: left;
    padding: 10px 14px; border-bottom: 1px solid var(--border-subtle); white-space: nowrap;
  }
  th.num, td.num { text-align: right; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text-secondary); }
  th .arr { font-size: 9px; margin-left: 3px; color: var(--accent); }
  td { padding: 9px 14px; border-bottom: 1px solid var(--border-subtle); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background 100ms; }
  tbody tr:hover { background: var(--hover); }
  td .pname { display: flex; align-items: center; gap: 8px; font-weight: 500; }
  td .pname .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  td.num { font: 12px var(--font-mono); color: var(--text-secondary); }
  td .cat { font-size: 11.5px; color: var(--text-muted); }

  /* ---- meters / bars ---- */
  .meter-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .meter-row .mlabel { width: 92px; font-size: 12.5px; flex: none; }
  .meter-row .mtrack { flex: 1; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .meter-row .mfill { height: 100%; border-radius: 4px; background: var(--text3); }
  .meter-row .mfill.lead { background: var(--accent); }
  .meter-row .mval { width: 86px; text-align: right; font: 11.5px var(--font-mono); color: var(--text-muted); flex: none; }

  /* ---- bar chart (CUI style: slim bars, rounded tops, dashed grid) ---- */
  .chart { position: relative; height: 220px; display: flex; align-items: flex-end; gap: 10px; padding-top: 4px; }
  .chart .gline { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); }
  .chart .gline span { position: absolute; right: 0; top: -14px; font: 10px var(--font-mono); color: var(--text-muted); }
  .chart .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; position: relative; z-index: 1; }
  .chart .bar i {
    width: min(34px, 70%); background: var(--accent); border-radius: 4px 4px 0 0;
    transition: filter 140ms; opacity: 0.85;
  }
  .chart .bar:hover i { filter: brightness(1.15); opacity: 1; }
  .chart .bar:hover .chip { opacity: 1; }
  .chart .bar .chip {
    position: absolute; bottom: calc(100% - 0px); transform: translateY(-6px);
    background: var(--raised); border: 1px solid var(--border); border-radius: 7px;
    padding: 3px 8px; font: 11px var(--font-mono); white-space: nowrap;
    opacity: 0; transition: opacity 140ms; pointer-events: none; z-index: 2;
  }
  .chart .bar .bl { font: 10px var(--font-mono); color: var(--text-muted); margin-top: 6px; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chart .zero { position: absolute; left: 0; right: 0; bottom: 22px; border-top: 1px solid var(--border); }

  /* ---- scatter ---- */
  .scatter-box canvas { width: 100%; height: 240px; display: block; border-radius: 8px; }
  .legend { display: flex; gap: 14px; margin-top: 12px; font-size: 11.5px; color: var(--text-secondary); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .dot { width: 7px; height: 7px; border-radius: 50%; }

  /* ---- insights ---- */
  .insight { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-subtle); font-size: 12.5px; }
  .insight:last-child { border-bottom: 0; }
  .insight .k { color: var(--text-muted); width: 130px; flex: none; }
  .insight .v { color: var(--text-secondary); }
  .insight .v b { color: var(--fg); font-weight: 500; }

  /* ---- palette + toast ---- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; justify-content: center; align-items: flex-start; padding-top: 14vh; z-index: 10; }
  .palette { width: 480px; background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-panel); overflow: hidden; box-shadow: 0 12px 32px rgba(0,0,0,0.12), 0 1px 3px rgba(0,0,0,0.06); }
  .palette-input { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border-subtle); color: var(--text-muted); }
  .palette-input input { flex: 1; background: none; border: 0; outline: 0; color: var(--fg); font: 13.5px var(--font-body); }
  .palette-list { max-height: 300px; overflow-y: auto; padding: 6px; }
  .pal-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .pal-item.sel, .pal-item:hover { background: var(--hover); }
  .pal-item .pv { margin-left: auto; font: 11px var(--font-mono); color: var(--text-muted); }
  .pal-empty { padding: 20px; text-align: center; color: var(--text-muted); font-size: 12.5px; }
  .toast {
    position: fixed; right: 20px; bottom: 20px; z-index: 20;
    background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-panel);
    padding: 12px 16px; font-size: 12.5px; box-shadow: 0 12px 32px rgba(0,0,0,0.18);
    display: flex; align-items: center; gap: 10px;
  }
  .toast .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
</style>

/* ---- CUI tokens, computed from cui_theme.c so the values are exact ---- */
function oklch(l, c, h, a = 1) {
  const hr = h * Math.PI / 180, ca = c * Math.cos(hr), cb = c * Math.sin(hr);
  const l_ = l + 0.3963377774 * ca + 0.2158037573 * cb;
  const m_ = l - 0.1055613458 * ca - 0.0638541728 * cb;
  const s_ = l - 0.0894841775 * ca - 1.2914855480 * cb;
  const L = l_ ** 3, M = m_ ** 3, S = s_ ** 3;
  const gam = u => { u = Math.max(0, Math.min(1, u)); return u <= 0.0031308 ? 12.92 * u : 1.055 * Math.pow(u, 1 / 2.4) - 0.055; };
  return `rgba(${Math.round(gam( 4.0767416621*L - 3.3077115913*M + 0.2309699292*S) * 255)},`
       + `${Math.round(gam(-1.2684380046*L + 2.6097574011*M - 0.3413193965*S) * 255)},`
       + `${Math.round(gam(-0.0041960863*L - 0.7034186147*M + 1.7076147010*S) * 255)},${a})`;
}
const gray = l => oklch(l, 0, 0);
const hex = h => `rgba(${(h>>16)&255},${(h>>8)&255},${h&255},1)`;
const hexa = (h, a) => `rgba(${(h>>16)&255},${(h>>8)&255},${h&255},${a})`;

/* dark-theme tokens (cui__theme_build, dark branch) */
const T = {
  bg: gray(0.18), surface: gray(0.21), raised: gray(0.24), muted: gray(0.26),
  fg: gray(0.96), text2: gray(0.77), text3: gray(0.64),
  border: gray(0.29), borderSubtle: gray(0.25), borderStrong: gray(0.515),
  track: gray(0.33), glyph: gray(0.19),
  success: oklch(0.79, 0.14, 162), info: oklch(0.79, 0.095, 236),
  warning: oklch(0.83, 0.12, 78), danger: oklch(0.70, 0.16, 24),
  series: [0x73aff1, 0xe7936c, 0x5ac299, 0xa3a0f1, 0xd1a24f, 0xe18cb5].map(hex),
};
/* the eight accents, dark-mode values from cui__accents */
const ACCENTS = [
  { name: "neutral", accent: gray(0.80), strong: gray(0.91), on: gray(0.93), glyph: gray(0.19), fg: T.bg },
  { name: "violet",  accent: hex(0xa78bff), strong: hex(0xc7b7ff), on: hex(0x7747ff), glyph: hex(0xffffff), fg: hex(0x15102b) },
  { name: "blue",    accent: hex(0x6ba3ff), strong: hex(0xa4c7ff), on: hex(0x0562ef), glyph: hex(0xffffff), fg: hex(0x0b1526) },
  { name: "green",   accent: hex(0x53dca6), strong: hex(0x93efd0), on: hex(0x00864b), glyph: hex(0xffffff), fg: hex(0x102016) },
  { name: "amber",   accent: hex(0xffcb62), strong: hex(0xffe0a1), on: hex(0xeda11a), glyph: hex(0x2a1c03), fg: hex(0x20190d) },
  { name: "orange",  accent: hex(0xffad5e), strong: hex(0xffd0a0), on: hex(0xc25300), glyph: hex(0xffffff), fg: hex(0x17130f) },
  { name: "coral",   accent: hex(0xff9386), strong: hex(0xffc1ba), on: hex(0xd1403a), glyph: hex(0xffffff), fg: hex(0x21110f) },
  { name: "rose",    accent: hex(0xff8bc5), strong: hex(0xffc0df), on: hex(0xd23286), glyph: hex(0xffffff), fg: hex(0x250f1b) },
];
let accentIdx = 3; /* green */

function applyTheme() {
  const a = ACCENTS[accentIdx];
  const r = document.documentElement.style;
  r.setProperty("--bg", T.bg); r.setProperty("--surface", T.surface);
  r.setProperty("--raised", T.raised); r.setProperty("--muted", T.muted);
  r.setProperty("--fg", T.fg); r.setProperty("--text-secondary", T.text2); r.setProperty("--text-muted", T.text3);
  r.setProperty("--border", T.border); r.setProperty("--border-subtle", T.borderSubtle); r.setProperty("--border-strong", T.borderStrong);
  r.setProperty("--hover", hexa(0xffffff, 0.05));
  r.setProperty("--accent", a.accent); r.setProperty("--accent-strong", a.strong);
  r.setProperty("--accent-subtle", hexa(0x00864b, 0.13).replace(/rgba\([^)]+\)/, a.accent.replace(/,[^,]+$/, ",0.13)")));
  r.setProperty("--control-on", a.on); r.setProperty("--control-glyph", a.glyph);
  r.setProperty("--accent-fg", a.fg);
  r.setProperty("--success", T.success); r.setProperty("--info", T.info);
  r.setProperty("--warning", T.warning); r.setProperty("--danger", T.danger);
  document.querySelectorAll(".accent-dot").forEach((d, i) => d.classList.toggle("sel", i === accentIdx));
}

const T_ = { bytes:0, loc:0, commits:0, dirty:0, nm:0, target:0, other:0, src:0, files:0 };
for (const p of P) for (const k of Object.keys(T_)) T_[k] += p[k];
const GIB = 1024 ** 3;
const gb = b => (b / GIB).toFixed(b / GIB >= 10 ? 1 : 2) + " GiB";
const n0 = n => n.toLocaleString("en-US");
const compact = n => n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n0(n);

/* CUI status semantics: success = active, info = dormant, danger = stale, muted = no git */
function status(p) {
  if (p.days === null) return { key:"no git", color:"var(--text-muted)" };
  if (p.days <= 30) return { key:"active", color:"var(--success)" };
  if (p.days <= 120) return { key:"dormant", color:"var(--info)" };
  return { key:"stale", color:"var(--danger)" };
}
const rebuildable = T_.nm + T_.target + T_.other;

/* ---- nav ---- */
const ICONS = {
  overview: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  projects: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>',
  languages: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6-6 6 6 6"/><path d="m16 6 6 6-6 6"/></svg>',
};
const NAV = [
  { id: "overview", label: "Overview" },
  { id: "projects", label: "Projects", count: P.length },
  { id: "languages", label: "Languages" },
];
let page = "overview";
function renderNav() {
  document.getElementById("nav").innerHTML = NAV.map(n =>
    `<button class="nav-item ${n.id === page ? "sel" : ""}" data-page="${n.id}">${ICONS[n.id]}<span>${n.label}</span>${n.count ? `<span class="nav-count">${n.count}</span>` : ""}</button>`).join("");
  document.querySelectorAll(".nav-item").forEach(b => b.onclick = () => go(b.dataset.page));
}
function go(id) {
  page = id;
  document.querySelectorAll(".page").forEach(s => s.classList.toggle("on", s.id === "page-" + id));
  document.getElementById("page-title").textContent = NAV.find(n => n.id === id).label;
  renderNav();
}

/* ---- overview ---- */
function metric(label, val, sub) {
  return `<div class="metric"><div class="lbl">${label}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`;
}
function renderOverview() {
  const top = [...P].sort((a, b) => b.bytes - a.bytes).slice(0, 10);
  const max = top[0].bytes;
  const counts = { active: 0, dormant: 0, stale: 0, "no git": 0 };
  for (const p of P) counts[status(p).key]++;
  const langTotals = {};
  for (const p of P) for (const [l, n] of Object.entries(p.langs)) langTotals[l] = (langTotals[l] || 0) + n;
  const lead = Object.entries(langTotals).sort((a, b) => b[1] - a[1])[0][0];

  document.getElementById("page-overview").innerHTML = `
    <div class="metrics">
      ${metric("On disk", gb(T_.bytes), `${P.length} projects · ${n0(T_.files)} files`)}
      ${metric("Lines of code", compact(T_.loc), `<b>${compact(T_.src)}</b> in source`)}
      ${metric("Commits", compact(T_.commits), `across ${P.filter(p => p.git).length} git repos`)}
      ${metric("Dirty files", n0(T_.dirty), `<b>${counts.active}</b> projects active`)}
    </div>
    <div class="grid2">
      <div class="panel">
        <h3>Disk by project</h3>
        <div class="desc">Ten largest folders · ${gb(T_.bytes)} total</div>
        <div class="chart" id="barchart"></div>
      </div>
      <div class="panel">
        <h3>Rebuildable</h3>
        <div class="desc">Space node_modules and build output could reclaim</div>
        <div class="val" style="font:500 26px/1.1 var(--font-mono)">${gb(rebuildable)}</div>
        <div class="desc" style="margin:6px 0 14px">of ${gb(T_.bytes)} on disk</div>
        <div class="meter-row"><div class="mtrack"><div class="mfill lead" style="width:${(rebuildable / T_.bytes * 100).toFixed(1)}%"></div></div></div>
        <div style="margin-top:14px">
          <div class="insight"><span class="k">Largest junk</span><span class="v"><b>${gb(P.find(p => p.name === "yotes").nm + P.find(p => p.name === "yotes").target)}</b> in yotes</span></div>
          <div class="insight"><span class="k">Dirtiest</span><span class="v"><b>${n0(T_.dirty)}</b> uncommitted files, ${n0(P.find(p => p.name === "notes").dirty)} in notes</span></div>
          <div class="insight"><span class="k">Quiet</span><span class="v"><b>${counts.stale}</b> projects untouched over a year</span></div>
        </div>
      </div>
    </div>
    <div class="panel" style="margin-top:12px">
      <h3>Momentum</h3>
      <div class="desc">Days since last commit against lines of code · bubble size is disk use</div>
      <div class="scatter-box"><canvas id="scatter" width="1000" height="480"></canvas></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--success)"></i>Active · 30d</span>
        <span><i class="dot" style="background:var(--info)"></i>Dormant · 120d</span>
        <span><i class="dot" style="background:var(--danger)"></i>Stale</span>
        <span><i class="dot" style="background:var(--text-muted)"></i>No git</span>
      </div>
    </div>`;

  const chart = document.getElementById("barchart");
  const lines = [0, 0.25, 0.5, 0.75, 1];
  chart.innerHTML = lines.map(f => `<div class="gline" style="bottom:${22 + f * 198}px"><span>${f ? gb(max * f) : ""}</span></div>`).join("")
    + top.map(p => `<div class="bar" title="${p.name}"><span class="chip">${gb(p.bytes)}</span><i style="height:${Math.max(2, p.bytes / max * 198)}px"></i><span class="bl">${p.name}</span></div>`).join("")
    + `<div class="zero"></div>`;

  drawScatter();
}

function drawScatter() {
  const cv = document.getElementById("scatter"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height, padL = 64, padB = 40, padT = 14, padR = 20;
  const css = getComputedStyle(document.documentElement);
  const c = n => css.getPropertyValue(n).trim();
  ctx.clearRect(0, 0, W, H);
  const maxLoc = Math.max(...P.map(p => p.loc));
  const X = d => padL + (W - padL - padR) * (1 - Math.min(1, Math.log10(Math.max(d, 1)) / Math.log10(400)));
  const Y = l => H - padB - (H - padB - padT) * (Math.log10(l + 1) / Math.log10(maxLoc + 1));
  ctx.font = "18px monospace"; ctx.fillStyle = c("--text-muted"); ctx.strokeStyle = c("--border-subtle");
  ctx.setLineDash([4, 4]);
  for (const d of [0, 30, 120, 365]) {
    ctx.beginPath(); ctx.moveTo(X(d), padT); ctx.lineTo(X(d), H - padB); ctx.stroke();
    if (d === 0) { ctx.textAlign = "right"; ctx.fillText("today", X(d) - 6, H - padB + 22); ctx.textAlign = "left"; }
    else ctx.fillText(d + "d", X(d) + 6, H - padB + 22);
  }
  ctx.setLineDash([]);
  ctx.strokeStyle = c("--border");
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  for (const l of [10e3, 100e3, 719112]) {
    ctx.fillStyle = c("--text-muted");
    ctx.fillText(compact(l), 8, Y(l) + 5);
  }
  const stColor = { "active": c("--success"), "dormant": c("--info"), "stale": c("--danger"), "no git": c("--text-muted") };
  for (const p of P) {
    const st = status(p);
    const r = 5 + Math.sqrt(p.bytes / 30e9) * 14;
    ctx.globalAlpha = 0.75; ctx.fillStyle = stColor[st.key];
    ctx.beginPath(); ctx.arc(X(p.days === null ? 400 : p.days), Y(p.loc), r, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    if (r > 12) { ctx.fillStyle = c("--fg"); ctx.font = "15px monospace"; ctx.fillText(p.name, X(p.days === null ? 400 : p.days) + r + 4, Y(p.loc) + 4); }
  }
}

/* ---- projects table ---- */
let sortKey = "bytes", sortDir = -1;
const COLS = [
  { key: "name", label: "Project", num: false },
  { key: "cat", label: "Category", num: false },
  { key: "bytes", label: "On disk", num: true },
  { key: "loc", label: "LOC", num: true },
  { key: "commits", label: "Commits", num: true },
  { key: "days", label: "Last commit", num: true },
  { key: "dirty", label: "Dirty", num: true },
];
function renderProjects() {
  const rows = [...P].sort((a, b) => {
    const va = a[sortKey] ?? -1, vb = b[sortKey] ?? -1;
    return (typeof va === "string" ? va.localeCompare(vb) : va - vb) * sortDir;
  });
  document.getElementById("page-projects").innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr>${COLS.map(c2 =>
        `<th class="${c2.num ? "num" : ""} ${c2.key !== "cat" ? "sortable" : ""}" data-key="${c2.key}">${c2.label}${sortKey === c2.key ? `<span class="arr">${sortDir < 0 ? "\u25BC" : "\u25B2"}</span>` : ""}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(p => {
        const st = status(p);
        return `<tr><td><span class="pname"><i class="dot" style="background:${st.color}"></i>${p.name}</span></td>
          <td><span class="cat">${p.cat}</span></td>
          <td class="num">${gb(p.bytes)}</td><td class="num">${n0(p.loc)}</td>
          <td class="num">${p.git ? n0(p.commits) : "\u2014"}</td>
          <td class="num">${p.days === null ? "never" : p.days === 0 ? "today" : p.days + "d ago"}</td>
          <td class="num" style="color:${p.dirty > 20 ? "var(--warning)" : "inherit"}">${p.dirty ? p.dirty : ""}</td></tr>`;
      }).join("")}</tbody>
    </table></div>`;
  document.querySelectorAll("th.sortable").forEach(th => th.onclick = () => {
    const k = th.dataset.key;
    if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = -1; }
    renderProjects();
  });
}

/* ---- languages ---- */
function renderLanguages() {
  const tot = {};
  for (const p of P) for (const [l, n] of Object.entries(p.langs)) tot[l] = (tot[l] || 0) + n;
  const rows = Object.entries(tot).sort((a, b) => b[1] - a[1]);
  const max = rows[0][1], sum = rows.reduce((s, r) => s + r[1], 0);
  document.getElementById("page-languages").innerHTML = `
    <div class="panel"><h3>Lines of code by language</h3>
    <div class="desc">${compact(sum)} lines across ${rows.length} languages · leader gets the accent</div>
    ${rows.map(([l, n], i) =>
      `<div class="meter-row"><span class="mlabel">${l}</span><div class="mtrack"><div class="mfill ${i === 0 ? "lead" : ""}" style="width:${(n / max * 100).toFixed(1)}%"></div></div><span class="mval">${compact(n)} · ${(n / sum * 100).toFixed(1)}%</span></div>`).join("")}
    </div>`;
}

/* ---- command palette ---- */
const scrim = document.getElementById("palette-scrim");
const input = document.getElementById("palette-input");
const list = document.getElementById("palette-list");
let palSel = 0, palRows = [];
function openPalette() { scrim.hidden = false; input.value = ""; palFilter(""); input.focus(); }
function closePalette() { scrim.hidden = true; }
function palFilter(q) {
  palRows = P.filter(p => p.name.toLowerCase().includes(q.toLowerCase())).slice(0, 8);
  palSel = 0;
  list.innerHTML = palRows.length
    ? palRows.map((p, i) => `<div class="pal-item ${i === 0 ? "sel" : ""}" data-i="${i}"><span class="pname" style="font-weight:400"><i class="dot" style="width:7px;height:7px;border-radius:50%;background:${status(p).color}"></i>${p.name}</span><span class="pv">${gb(p.bytes)}</span></div>`).join("")
    : `<div class="pal-empty">No project named \u201C${q}\u201D</div>`;
  list.querySelectorAll(".pal-item").forEach(el => el.onclick = () => palGo(+el.dataset.i));
}
function palGo(i) { if (palRows[i]) { closePalette(); toast(`Opening ${palRows[i].name}`); } }
function palMove(d) {
  if (!palRows.length) return;
  palSel = (palSel + d + palRows.length) % palRows.length;
  list.querySelectorAll(".pal-item").forEach((el, i) => el.classList.toggle("sel", i === palSel));
}
input.addEventListener("input", () => palFilter(input.value));
input.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); palMove(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); palMove(-1); }
  else if (e.key === "Enter") palGo(palSel);
  else if (e.key === "Escape") closePalette();
});
scrim.addEventListener("mousedown", e => { if (e.target === scrim) closePalette(); });
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); scrim.hidden ? openPalette() : closePalette(); }
});
document.getElementById("search-open").onclick = openPalette;

/* ---- toast ---- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.innerHTML = `<span class="dot"></span>${msg}`;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}
document.getElementById("rescan").onclick = () => toast("Rescan queued \u00B7 P:\\Projects");

/* ---- accent picker + init ---- */
document.getElementById("accent-row").innerHTML =
  ACCENTS.map((a, i) => `<button class="accent-dot" data-i="${i}" style="background:${a.accent}" title="${a.name}"></button>`).join("");
document.querySelectorAll(".accent-dot").forEach(b => b.onclick = () => { accentIdx = +b.dataset.i; applyTheme(); drawScatter(); });
applyTheme();
renderNav();
if (location.hash) { const h = location.hash.slice(2); if (h === "projects" || h === "languages" || h === "palette") { h === "palette" ? (renderNav(), openPalette()) : go(h); } }
renderOverview();
renderProjects();
renderLanguages();
</script>
</body>
