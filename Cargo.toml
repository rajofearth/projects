[package]
name = "projects-stats"
version = "0.2.1"
edition = "2024"
default-run = "projects-stats"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c", features = ["tooling", "native-file-dialog"] }
serde = { version = "1", features = ["derive"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c" }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
ruzstd = "0.8"
# Update verification: the release exe's SHA-256 and its Ed25519 signature.
sha2 = "0.10"
ed25519-dalek = "2"
# Release signing keys come from the OS random source (the release-sign tool only).
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_WindowsAndMessaging"] }
# The Start menu shortcut (IShellLinkW). Rune already builds this crate with these features.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# Rune's patched crates, from the same commit (a dependency's [patch] doesn't reach this workspace).
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c" }
winit = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c" }

[profile.release]
opt-level = 2
lto = "thin"
panic = "abort"
strip = "symbols"
