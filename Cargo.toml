[package]
name = "projects-stats"
version = "0.1.0"
edition = "2024"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c", features = ["tooling"] }
serde = { version = "1", features = ["derive"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time"] }

# Rune's patched crates, from the same commit (a dependency's [patch] doesn't reach this workspace).
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c" }
winit = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c" }

[profile.release]
opt-level = 2
lto = "thin"
panic = "abort"
strip = "symbols"
