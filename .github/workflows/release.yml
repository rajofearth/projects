name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.2.0 (created at the selected branch if it does not exist)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build, sign and publish (Windows)
    runs-on: windows-latest
    # RELEASE_SIGNING_KEY lives in this environment; give it required reviewers and limit it to v* tags.
    environment: release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The updater compares the tag against the version built into the exe, so they must agree.
      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG doesn't match Cargo.toml version $version" }
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build release exe
        run: cargo build --release --bins

      # The app downloads these two files. The names carry no version, so
      # releases/latest/download/projects-windows-x64.exe always serves the newest build.
      - name: Sign
        shell: pwsh
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if (-not $env:RELEASE_SIGNING_KEY) { throw "The RELEASE_SIGNING_KEY secret isn't set" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/projects-stats.exe dist/projects-windows-x64.exe
          target/release/release-sign.exe sign dist/projects-windows-x64.exe $env:VERSION dist/projects-windows-x64.exe.sig
          if ($LASTEXITCODE -ne 0) { throw "Signing failed" }
          # Checks with the public key compiled into the app, so a key mismatch fails here, not on users' machines.
          target/release/release-sign.exe verify dist/projects-windows-x64.exe dist/projects-windows-x64.exe.sig
          if ($LASTEXITCODE -ne 0) { throw "The signature doesn't verify" }

      - name: Create GitHub release
        shell: pwsh
        run: |
          gh release create $env:TAG dist/projects-windows-x64.exe dist/projects-windows-x64.exe.sig `
            --title "Projects $env:TAG" `
            --generate-notes
