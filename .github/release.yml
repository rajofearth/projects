# Groups the notes that `gh release create --generate-notes` writes, by PR label.
changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Other
      labels:
        - "*"
